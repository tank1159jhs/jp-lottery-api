name: Update Lottery Data

# 매주 월, 화, 목, 금 19:00 ~ 21:50 (JST) 10분 간격 실행
# 월(1)/목(4): Loto6, 화(2): Mini Loto, 금(5): Loto7
on:
  schedule:
    # UTC 시간 기준: JST 19:00 ~ 21:50 (UTC 10:00 ~ 12:50)
    # 요일: 1(월), 2(화), 4(목), 5(금)
    - cron: '*/10 10-12 * * 1,2,4,5'
  
  # 수동 실행도 가능
  workflow_dispatch:

jobs:
  crawl-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        
      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: 📦 Install dependencies
        run: npm install
        
      - name: 🔍 Crawl Lottery data (Day-based)
        run: |
          # 요일 확인 (1=월, 2=화, ..., 7=일)
          DOW=$(date +%u)
          echo "📅 Today is day $DOW (1=Mon, 2=Tue, 4=Thu, 5=Fri)"

          if [ "$DOW" -eq 1 ] || [ "$DOW" -eq 4 ]; then
            echo "🎰 [Mon/Thu] Running Loto6 Crawler..."
            node loto6-crawl.js
          elif [ "$DOW" -eq 2 ]; then
            echo "🎰 [Tue] Running Mini Loto Crawler..."
            node miniloto-crawl.js
          elif [ "$DOW" -eq 5 ]; then
            echo "🎰 [Fri] Running Loto7 Crawler..."
            node loto7-crawl.js
          fi
        continue-on-error: false
        
      - name: 📊 Check data files
        run: |
          echo "=== Data files created ==="
          ls -R data/
        
      - name: 📤 Commit and push
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add data/
          
          # 변경사항이 있을 때만 커밋
          if git diff --staged --quiet; then
            echo "⚠️  변경사항 없음 - 커밋 건너뜀"
          else
            git commit -m "🎰 Update Lottery data ($(date +'%Y-%m-%d %H:%M JST'))"
            git push
            echo "✅ 데이터 업데이트 완료!"
          fi